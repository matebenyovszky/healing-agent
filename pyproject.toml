[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healing_agent"
version = "0.2.7"
authors = [
    { name = "Máté Benyovszky", email = "benyovszky.mate.work@outlook.com" },
]
description = "An AI-powered agent that helps fix and heal buggy code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "ai",
    "debugging",
    "error-handling",
    "code-repair",
    "automation",
    "developer-tools",
    "openai",
    "exception-handling",
    "code-healing",
    "bug-fixing",
    "agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
]
dependencies = [
    "openai>=2.20.0,<4",
    "httpx>=0.28.1,<1",
    "requests>=2.34.2,<3"
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.121.0,<1"]
litellm = ["litellm>=1.96.2,<2"]
dev = ["build>=1.2", "hatchling>=1.26", "pytest>=8", "twine>=5"]

[project.urls]
"Homepage" = "https://github.com/matebenyovszky/healing-agent"
"Bug Tracker" = "https://github.com/matebenyovszky/healing-agent/issues"
"Documentation" = "https://github.com/matebenyovszky/healing-agent#readme"
"Repository" = "https://github.com/matebenyovszky/healing-agent.git"
"Changelog" = "https://github.com/matebenyovszky/healing-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["healing_agent"]

[tool.hatch.build]
exclude = [
    "/.tmp-release-*",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
