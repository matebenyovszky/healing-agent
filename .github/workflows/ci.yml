name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an advisory published against an unchanged dependency tree
    # still turns the audit red without waiting for the next commit.
    - cron: "41 5 * * 1"

permissions:
  contents: read

# Every job installs requirements/ci.txt with --require-hashes: exact
# versions whose hashes were reviewed in a pull request, not whatever the
# index serves at that minute. The project itself then goes in with
# --no-deps, so nothing unpinned rides along, and `pip check` proves the
# locked versions satisfy pyproject.toml's ranges.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip install --no-deps -e .
      # Rule selection lives in pyproject.toml: defect-hunting rules only, no
      # style opinions, so a failure here always means something real.
      - run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      # --no-isolation builds with the locked hatchling; an isolated build
      # would fetch an unpinned one from the index.
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      # 1. The locked tree that CI and the release build run.
      - run: >
          python -m pip_audit --progress-spinner off
          --disable-pip --require-hashes -r requirements/ci.txt
      # 2. What a user gets from `pip install healing-agent[anthropic]` today:
      #    the newest versions pyproject.toml allows, resolved but not
      #    installed. No ignores either way, so any known vulnerability fails.
      - run: >
          python -m uv pip compile pyproject.toml --extra anthropic
          --python-version 3.13 --generate-hashes -o "$RUNNER_TEMP/latest.txt"
      - run: >
          python -m pip_audit --progress-spinner off
          --disable-pip --require-hashes -r "$RUNNER_TEMP/latest.txt"
