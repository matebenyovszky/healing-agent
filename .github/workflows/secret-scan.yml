name: Secret Scan

# Defense-in-depth: scan the FULL git history (all refs) for committed secrets
# on every push and PR. We run the gitleaks CLI directly rather than the
# push-diff action, because after a history rewrite / force-push the
# "previous commit" the action tries to diff against no longer exists.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly full-history re-scan (Mondays 06:00 UTC)

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history, not just the tip
          persist-credentials: false

      - name: Install gitleaks
        run: |
          # Bump VERSION and SHA256 together, from the release's checksums.txt.
          # Verifying the archive is what keeps a swapped download from
          # running inside the job that guards against leaked secrets.
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          sudo tar -xzf "$ARCHIVE" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history (all refs)
        run: >
          gitleaks git .
          --config .gitleaks.toml
          --redact
          --verbose
          --exit-code 1
          --log-opts=--all
