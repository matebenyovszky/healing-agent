name: Publish Python Package

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/healing-agent
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest
    - name: Build package
      run: python -m build
    - name: Check package metadata
      run: python -m twine check dist/*
    
    # Manual runs are a TestPyPI dry run.
    - name: Publish to Test PyPI
      if: github.event_name == 'workflow_dispatch'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        verbose: true
        print-hash: true
        skip-existing: true  # Skip if version exists
        
    # Version tags publish only to production PyPI. Keeping registry uploads on
    # separate runs also prevents duplicate PEP 740 attestation generation.
    - name: Publish to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true
        skip-existing: true  # Skip if version exists
